name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # burn-mamba is a subtree with its own formatting checks and upstream
      # history; format the Quasar package without rewriting vendored sources.
      - run: cargo fmt --package quasar --check
      - run: cargo clippy --all-targets
      # The default backend is CPU, so the whole suite -- real forward and
      # backward passes included -- runs on a hosted runner.
      - run: cargo test --all-targets
      - run: cargo run --release -- budget tiny
      - run: cargo run --release -- budget tiny-turbo

  # The dataset, grader, renderer and plots. No GPU and no wheels to download:
  # the harness declares no runtime dependencies, so this is `uv` fetching a
  # linter and a test runner and nothing else.
  harness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: factorio
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q

  # The whole blueprint pipeline on the maintainer's card: corpus, training,
  # generation from every checkpoint, grade and plots. An hour is the budget the
  # run is sized to -- the training length is the Chinchilla one, 20 tokens per
  # parameter -- and the artifacts are the point of it: the metrics board and the
  # contact sheet are what say whether it worked.
  blueprints:
    if: github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record GPU runtime
        run: |
          rocminfo | grep -m1 -E 'Name:.*gfx'
          rocm-smi --showproductname --showmeminfo vram
      # A clear failure on the first step beats a SyntaxError forty minutes of
      # cached build later.
      - name: Check the harness interpreter
        run: python3 -c 'import sys; assert sys.version_info >= (3, 11), sys.version'
      # Human blueprints. `checkout` cleans ignored files, so the crawl would be
      # repeated every run; the cache is what makes it happen once. The key is
      # fixed rather than hashed over anything, because a cache of other
      # people's uploads does not go stale in a way a training run can tell.
      - name: Cache the blueprint archive
        uses: actions/cache@v4
        with:
          path: factorio/data
          key: factorio-blueprints-v1-6000
      # The crawl is somebody else's server, so a failure here degrades the run
      # to a synthetic corpus rather than failing it. `examples/factorio.sh`
      # decides by whether the file exists.
      - name: Fetch what the cache is missing
        continue-on-error: true
        run: python3 factorio/tools/fetch_blueprints.py --count 6000
      # `factorio-nano` at micro_batch 32 uses a fraction of the 135
      # micro-batches that fit 16 GiB -- see `budget factorio-nano` -- so this
      # cannot run the card out of memory however long it is left going.
      - name: Corpus, training, generation and grade
        env:
          DESIGNS: "20000"
          PROMPTS: "48"
          # Parameter scales every 25 steps. A run that comes apart is the one
          # thing the artifacts cannot explain after the fact -- the checkpoint
          # is all NaN, so it says nothing about which tensor went first -- and
          # 172 device syncs across a quarter-hour run is not a cost worth
          # weighing against that.
          QUASAR_TRACE_NORMS: "25"
        run: BACKEND=vulkan examples/factorio.sh runs/nano
      - name: Preserve the run
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: blueprints
          path: |
            runs/nano/*.png
            runs/nano/*.json
            runs/nano/*.jsonl
            runs/nano/*.log
            runs/nano/*.blueprint
            runs/nano/frames/*.png

  # Freeze the production optimizer-step baseline, then establish whether this
  # exact Burn/CubeCL/Vulkan stack can reach RDNA4 matrix throughput at all.
  # Precision work is gated on these numbers instead of a global dtype guess.
  gpu-benchmark:
    needs: backend-spike
    runs-on: self-hosted
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record GPU runtime
        run: |
          mkdir -p benchmark-logs
          {
            git rev-parse HEAD
            rustc -Vv
            cargo -V
            uname -a
            rocminfo | grep -m1 -E 'Name:.*gfx'
            rocm-smi --showproductname --showmeminfo vram --showclocks \
              --showuse --showtemp --showpower
            vulkaninfo --summary || true
          } 2>&1 | tee benchmark-logs/environment.log
      # Keep the established K4/K1/fused-scan regression gate as well as the
      # new precision work. The P0 freeze answers a different question: whether
      # the complete production recipe remains within its throughput/VRAM
      # envelope.
      - name: Regression — stepwise state-passing kernel A/B
        run: examples/state_passing_ab.sh
      - name: P0 — production optimizer-step baseline
        run: examples/performance_baseline.sh
      - name: P0 — synchronized CubeCL kernel profile
        working-directory: experiments/profile
        run: >-
          cargo run --manifest-path ../../Cargo.toml --release
          --no-default-features --features vulkan --example train_bench --
          --model tiny-turbo --micro-batch 1 --accum 1
          --warmup 1 --steps 3 --max-steps 3
          --dtype f32 --ssd serial --checkpointing false --muon true
          --head-dtype f16
          2>&1 | tee ../../benchmark-logs/profile.log
      - name: P1 — dense GEMM roofline
        run: examples/roofline.sh
      # Retain each accepted seam as an independent regression gate.
      - name: P4 — paired FP16 head vs head plus FFN
        run: examples/fp16_ffn_ab.sh
      # P4 is the production reference. Spend the same paired quality budget on
      # exactly one remaining large model-level projection family.
      - name: P5 — paired FP16 head plus FFN vs Mamba projections
        run: examples/fp16_mamba_projection_ab.sh
      - name: Preserve performance diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-diagnostics
          path: benchmark-logs/

  # Issue #23: the reported recipe, past the steps it reported failing at, in
  # every precision the card can run. A unit test can show the guard rejects a
  # gradient it was handed; only this can show whether the recipe still produces
  # one, and which precision it belongs to. It is deliberately independent of
  # `gpu-benchmark`: throughput and convergence fail for different reasons, and
  # a job that answers both answers neither when it goes red.
  stability:
    runs-on: self-hosted
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record GPU runtime
        run: |
          mkdir -p benchmark-logs/stability
          {
            git rev-parse HEAD
            rocminfo | grep -m1 -E 'Name:.*gfx'
            rocm-smi --showproductname --showmeminfo vram
          } 2>&1 | tee benchmark-logs/stability/environment.log
      # `STABILITY_ACCUM` is the only departure from the reported command, and
      # `examples/stability.sh` says why: four verbatim arms are over an hour on
      # the one card the whole self-hosted half of CI shares, and a quarter of
      # the accumulation at the same rate is four times the gradient noise,
      # which is the harder test rather than the softer one. The micro-batch,
      # and therefore the VRAM shape, is the reported one.
      - name: The issue #23 recipe in fp32, fp16 and bf16
        env:
          STABILITY_ACCUM: "8"
        run: BACKEND=vulkan examples/stability.sh
      - name: Preserve the four arms
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability
          path: |
            benchmark-logs/stability/*.log
            benchmark-logs/stability/*.result

  # P7 bypasses CubeCL's AMD matmul compiler and measures the vendor library
  # directly on the same forward/backward projection triplet as the Vulkan
  # reference. It remains isolated until both precision and speed gates pass.
  backend-spike:
    runs-on: self-hosted
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Record hipBLASLt runtime
        run: |
          mkdir -p benchmark-logs
          {
            git rev-parse HEAD
            hipcc --version
            rocminfo | grep -m1 -E 'Name:.*gfx'
            rocm-smi --showproductname --showmeminfo vram
            test -f /opt/rocm/include/hipblaslt/hipblaslt.h
            ldconfig -p | grep hipblaslt
          } 2>&1 | tee benchmark-logs/hipblaslt-environment.log
      - name: P7 — Vulkan vs direct hipBLASLt linear forward/backward
        run: examples/hipblaslt_ab.sh
      - name: Preserve backend-spike diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-spike-diagnostics
          path: benchmark-logs/

  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The pipeline end to end on a synthetic corpus: the bugs this catches
      # (vocabulary mismatches, checkpoint collisions) are invisible to unit
      # tests because they live between the commands.
      - run: examples/smoke.sh
