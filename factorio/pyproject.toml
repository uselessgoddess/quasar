[project]
name = "quasar-factorio"
version = "0.1.0"
description = "Dataset, evaluation and rendering harness for training quasar to write Factorio blueprints"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT OR Apache-2.0" }
dependencies = []

[project.optional-dependencies]
# Only the plotting entry points need these. Dataset construction, tokenisation,
# validation and the SVG renderer are deliberately dependency-free so that CI can
# build a corpus without a wheel download.
plots = ["matplotlib>=3.8"]

[project.scripts]
quasar-factorio = "quasar_factorio.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quasar_factorio"]

[tool.ruff]
line-length = 100
src = ["src", "tools", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# A unit test that needs more than five seconds is a test that is doing
# something other than testing.
timeout = 60
